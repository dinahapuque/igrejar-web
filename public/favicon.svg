<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="round"><rect width="1024" height="1024" rx="224"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33603E"/>
      <stop offset="1" stop-color="#172815"/>
    </linearGradient>
    <mask id="arrow" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(512 512) scale(0.9783) translate(-565.1 -493.1)">
        <path d="M827.2 276.0 L602.2 769.4 A34 34 0 0 1 538.8 765.2 L485.5 591.1 A16 16 0 0 0 474.9 580.5 L299.4 526.6 A34 34 0 0 1 294.8 463.4 L781.7 231.2 A34 34 0 0 1 827.2 276.0z" fill="#fff"/>
        <rect x="566.0" y="394.0" width="32" height="172" rx="9" fill="#000"/><rect x="520.0" y="434.0" width="124" height="32" rx="9" fill="#000"/>
      </g>
    </mask>
  </defs>
  <g clip-path="url(#round)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- symmetric navigation arrow; tip and wing ends share one corner radius; centred on its optical centre; the cross is cut out of it -->
  <rect width="1024" height="1024" fill="#5ED7AB" mask="url(#arrow)"/>
  </g>
</svg>
